spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # (use 'validate' or 'none' in production)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never         # change to 'always' if you want schema.sql/data.sql to run automatically

    jackson:
      serialization:
        fail-on-empty-beans: false

jwt:
  secret: ${JWT_SECRET:mysecretjwtkey}
  expiration: ${JWT_EXPIRATION:86400000} # 1 day in ms

server:
  port: 8080

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.ecommerce.ecommercebackend: DEBUG
